<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSupport Documentation</title>
  <link rel="stylesheet" href="src/css/main.css">
  <link rel="icon" type="image/svg+xml" href="src/opensupport_assets/opensupport_icon.svg">
</head>
<body>

  <header>
    <div class="header-left">
      <a href="./" class="brand">
        <img src="src/opensupport_assets/opensupport_logo.svg" alt="OpenSupport Logo">
      </a>
      <div class="search-wrapper">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search...">
      </div>
    </div>
    <div class="header-actions">
      <a id="githubBtn" class="github-link" href="https://logreee.github.io/opensupport-app" target="_blank" rel="noopener noreferrer" title="GitHub Repository">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      </a>
      <div class="lang-switcher">
        <select id="langSelect">
          <option value="en">English (EN)</option>
          <option value="fr">Français (FR)</option>
        </select>
      </div>
    </div>
  </header>

  <div class="container docs">
    <nav class="sidebar" id="sidebarNav"></nav>
    <main id="docsContent"></main>
  </div>

  <!-- Footer -->
  <footer>
  </footer>
  
  <script src="src/js/main.js"></script>
</body>
</html>
